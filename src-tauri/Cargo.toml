[package]
name = "toneweave"
version = "0.1.0"
description = "Thoughtful email replies, in your voice"
authors = ["Cyberneura"]
license = "MIT"
edition = "2021"
# crates.io には出さない。cargo-about が自分自身を THIRD-PARTY-NOTICES.txt に載せないためにも要る
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt-multi-thread", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"
shlex = "1"
